services:
  - type: web
    name: sexy-prime-ads-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: RUN_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: AGENCY_NAME
        value: Sexy Prime
      - key: SITE_API_URL
        value: https://sxyprime.com/api/bot_ads_gateway.php
      - key: SITE_API_SECRET
        sync: false
      - key: SITE_PANEL_URL
        value: https://sxyprime.com/editar_perfil_modelo.php#telegram-bot-ads
      - key: SITE_ADMIN_URL
        value: https://sxyprime.com/admin/bot_ads.php
      - key: DB_PATH
        value: data/sexy_prime_ads_runtime.db
      - key: JOB_INTERVAL_SECONDS
        value: 30
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_PATH
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
